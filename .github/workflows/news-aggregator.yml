name: News Aggregator

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Run avviato da cron-job.org (sleep random anti-pattern)'
        required: false
        default: 'false'
        type: boolean
      tier:
        description: 'Filtro tier: primary (MIM/USR/INPS/sindacati) o aggregator (Orizzonte/Tecnica) o vuoto=tutti'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - primary
          - aggregator

permissions:
  contents: write

concurrency:
  group: news-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep (solo run da cron)
        if: inputs.scheduled == 'true'
        run: |
          SLEEP=$((RANDOM % 240))
          echo "Sleeping $SLEEP seconds"
          sleep $SLEEP

      - uses: actions/checkout@v6
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run news aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_MIU: ${{ secrets.GEMINI_API_KEY_MIU }}
          GEMINI_API_KEY_PRO: ${{ secrets.GEMINI_API_KEY_PRO }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NEWS_TIER: ${{ inputs.tier }}
        run: |
          date
          echo "Tier filter: ${{ inputs.tier }}"
          if [ -n "${{ inputs.tier }}" ]; then
            node scripts/news-aggregator.js --tier=${{ inputs.tier }}
          else
            node scripts/news-aggregator.js
          fi

      - name: Commit and push changes
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "notizie: aggiornamento automatico $(date +'%Y-%m-%d') [skip actions]"
          # Push con retry e merge union per race condition (fix 2026-08-24: gestisce anche data/news-sources.json e aumenta a 5 tentativi)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push ok al tentativo $i"
              exit 0
            fi
            echo "Push fallito (tentativo $i/5) — remote avanzato, eseguo rebase + merge union di .published.json e news-sources.json"
            git fetch origin main
            # Salva nostre versioni prima del rebase
            cp notizie/.published.json /tmp/ours.json 2>/dev/null || true
            cp data/news-sources.json /tmp/ours_sources.json 2>/dev/null || true
            if ! git rebase origin/main; then
              echo "Rebase fallito, eseguo merge union manuale"
              git rebase --abort || true
              git fetch origin main
              # --- merge .published.json ---
              cp /tmp/ours.json notizie/.published.json 2>/dev/null || true
              cp notizie/.published.json /tmp/ours2.json 2>/dev/null || true
              git checkout origin/main -- notizie/.published.json 2>/dev/null || true
              cp notizie/.published.json /tmp/theirs.json 2>/dev/null || true
              node -e "
                const fs=require('fs');
                try{
                  const ours=JSON.parse(fs.readFileSync('/tmp/ours2.json','utf8'));
                  const theirs=JSON.parse(fs.readFileSync('/tmp/theirs.json','utf8'));
                  const seen=new Set(theirs.map(e=>e.slug));
                  const merged=[...theirs];
                  let added=0;
                  for(const e of ours){ if(!seen.has(e.slug)){ merged.push(e); seen.add(e.slug); added++; } }
                  const dedup=[]; const s2=new Set();
                  for(const e of merged){ if(s2.has(e.slug)) continue; s2.add(e.slug); dedup.push(e); }
                  dedup.sort((a,b)=>(a.dateObj||'').localeCompare(b.dateObj||''));
                  fs.writeFileSync('notizie/.published.json', JSON.stringify(dedup,null,2)+'\n');
                  console.log('Merge union published: theirs '+theirs.length+' + ours '+ours.length+' -> '+dedup.length+' (added '+added+')');
                }catch(e){ console.log('Merge published skip: '+e.message); }
              "
              # --- merge data/news-sources.json (union per site) ---
              cp /tmp/ours_sources.json data/news-sources.json 2>/dev/null || true
              cp data/news-sources.json /tmp/ours2_sources.json 2>/dev/null || true
              git checkout origin/main -- data/news-sources.json 2>/dev/null || true
              cp data/news-sources.json /tmp/theirs_sources.json 2>/dev/null || true
              node -e "
                const fs=require('fs');
                try{
                  const ours=JSON.parse(fs.readFileSync('/tmp/ours2_sources.json','utf8'));
                  const theirs=JSON.parse(fs.readFileSync('/tmp/theirs_sources.json','utf8'));
                  const bySite=new Map(theirs.sources.map(s=>[s.site,s]));
                  let added=0;
                  for(const s of ours.sources){ if(!bySite.has(s.site)){ bySite.set(s.site,s); added++; } }
                  const merged={...theirs, sources: Array.from(bySite.values()), updatedAt: new Date().toISOString()};
                  // ordina per site per stabilità
                  merged.sources.sort((a,b)=>a.site.localeCompare(b.site));
                  fs.writeFileSync('data/news-sources.json', JSON.stringify(merged,null,2)+'\n');
                  console.log('Merge union sources: theirs '+theirs.sources.length+' + ours '+ours.sources.length+' -> '+merged.sources.length+' (added '+added+')');
                }catch(e){ console.log('Merge sources skip: '+e.message); }
              "
              node scripts/news-aggregator.js --regen-pages || true
              git add -A
              if git diff --cached --quiet; then
                echo "Niente da committare dopo il merge"
                git rebase --skip 2>/dev/null || true
              else
                git commit -m "notizie: merge union dopo race [skip actions]" || true
              fi
            else
              # Rebase riuscito — rigenera pagine se .published.json è cambiato
              node scripts/news-aggregator.js --regen-pages || true
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "notizie: regen dopo rebase [skip actions]" || true
              fi
            fi
            sleep 5
          done
          echo "Push fallito dopo 5 tentativi"
          exit 1
