name: One-off export SMTP secret (encrypted)
# TEMPORANEO: esporta SMTP_PASS cifrato con una chiave RSA pubblica fornita
# dall'operatore (la chiave privata resta fuori da GitHub). L'artifact contiene
# solo ciphertext. Da eliminare subito dopo l'uso.
on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: 'Chiave pubblica RSA (PEM) in base64'
        required: true
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt SMTP_PASS
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PUBKEY_B64: ${{ inputs.pubkey_b64 }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_PASS:-}" ]; then echo "❌ SMTP_PASS mancante"; exit 1; fi
          printf '%s' "$PUBKEY_B64" | base64 -d > /tmp/pub.pem
          printf '%s' "$SMTP_PASS" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem \
            -pkeyopt rsa_padding_mode:oaep -out /tmp/smtp.enc
          base64 /tmp/smtp.enc > smtp-pass.enc.b64
          echo "Ciphertext pronto ($(wc -c < smtp-pass.enc.b64) byte base64)"
      - uses: actions/upload-artifact@v4
        with:
          name: smtp-pass-enc
          path: smtp-pass.enc.b64
          retention-days: 1
