name: Offer Timers Renewal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Renew expired timers
        run: node scripts/manage-offer-timers.js

      - name: Commit and push changes
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "timer: rinnovo automatico offerte $(date +'%Y-%m-%d') [skip ci]"
          # Push con retry: GitHub può rispondere con "fatal error in commit_refs" (server-side transitorio)
          LAST_ERR=""
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main; then
              if PUSH_OUT=$(git push 2>&1); then
                echo "$PUSH_OUT"
                echo "✅ push ok al tentativo $i"
                LAST_ERR=""
                break
              fi
              echo "$PUSH_OUT"
              LAST_ERR="$PUSH_OUT"
            else
              echo "⚠️ pull/rebase fallito al tentativo $i"
              git rebase --abort 2>/dev/null || true
              LAST_ERR="pull/rebase failed"
            fi
            SLEEP=$((5 * (1 << (i-1)) + RANDOM % 10))
            if [ "$SLEEP" -gt 60 ]; then SLEEP=60; fi
            echo "Attesa ${SLEEP}s prima del retry $((i+1))/5..."
            sleep "$SLEEP"
          done
          if [ -n "$LAST_ERR" ]; then
            if echo "$LAST_ERR" | grep -q "fatal error in commit_refs"; then
              echo "::warning::Push rifiutato da GitHub (fatal error in commit_refs) dopo 5 tentativi; timer rimandati al prossimo run."
            else
              echo "::error::Push fallito dopo 5 tentativi per un errore non transitorio."
              exit 1
            fi
          fi
