name: One-off sync SMTP secret to private repo
# TEMPORANEO: copia SMTP_USER/SMTP_PASS (validi, usati dal job LeadGen) nei
# secret del repo privato cemform/cemform.it, così il workflow
# "Sync SMTP env to Vercel" può allineare le env di Vercel.
# Non stampa mai i valori. Da eliminare dopo l'uso.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy SMTP_USER / SMTP_PASS to cemform/cemform.it
        env:
          GH_TOKEN: ${{ secrets.PAT_PRIVATE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "❌ PAT_PRIVATE mancante"; exit 1; fi
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then echo "❌ SMTP_USER/SMTP_PASS mancanti"; exit 1; fi
          printf '%s' "$SMTP_USER" | gh secret set SMTP_USER --repo cemform/cemform.it
          printf '%s' "$SMTP_PASS" | gh secret set SMTP_PASS --repo cemform/cemform.it
          echo "✅ Secret aggiornati in cemform/cemform.it"
