name: leadgen-daily

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo preparazione email (nessun invio reale)'
        type: boolean
        default: true
      send_only:
        description: 'Solo invio ai lead già qualificati (salta discovery/enrich/verify/score, segna sent_at)'
        type: boolean
        default: false
      sources:
        description: 'Sorgenti da eseguire (csv, vuoto = tutte quelle abilitate)'
        type: string
        default: ''

# B: DB non più in git (PII) -> cache+artifact, non serve contents:write
permissions:
  contents: read
  actions: write

jobs:
  leadgen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}

      # --- B: ripristino DB fuori da git (cache + artifact fallback) ---
      - name: Restore LeadGen DB (cache)
        uses: actions/cache/restore@v4
        with:
          path: leadgen/data/leadgen.db
          key: leadgen-db-v1
          restore-keys: |
            leadgen-db-

      - name: Restore LeadGen DB (artifact fallback)
        if: hashFiles('leadgen/data/leadgen.db') == ''
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: leadgen.yml
          branch: main
          name: leadgen-db
          path: leadgen/data
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: LeadGen run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_MIU: ${{ secrets.GEMINI_API_KEY_MIU }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_USER: ${{ secrets.SMTP_USER }}
          IMAP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          ARGS=""
          if [ "${{ inputs.send_only }}" = "true" ]; then
            ARGS="$ARGS --send-only"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --only ${{ inputs.sources }}"; fi
          node scripts/leadgen-run.js $ARGS

      - name: IMAP poll (bounce / reply / opt-out)
        if: always()
        env:
          IMAP_USER: ${{ secrets.SMTP_USER }}
          IMAP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/leadgen-run.js --imap || true

      # --- B: salvataggio DB fuori da git (cache + artifact) ---
      - name: Save LeadGen DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: leadgen/data/leadgen.db
          key: leadgen-db-v1-${{ github.run_id }}

      - name: Save LeadGen DB to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadgen-db
          path: leadgen/data/leadgen.db
          retention-days: 90
          if-no-files-found: warn
