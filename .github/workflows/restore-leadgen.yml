name: restore-leadgen-db

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download old DB (7.179 centri)
        run: |
          mkdir -p leadgen/data
          echo "Downloading old DB from raw github..."
          curl -L -o leadgen/data/leadgen.db "https://raw.githubusercontent.com/cemform/cemform-actions-only/main/leadgen-restore-7179.db"
          ls -lh leadgen/data/leadgen.db
          node -e "const db=require('better-sqlite3')('leadgen/data/leadgen.db'); console.log('companies',db.prepare('SELECT count(*) FROM companies').pluck().get()); console.log('contacts',db.prepare('SELECT count(*) FROM contacts').pluck().get())"

      - name: Save to cache
        uses: actions/cache/save@v4
        with:
          path: leadgen/data/leadgen.db
          key: leadgen-db-v1-restore-7179

      - name: Save to artifact
        uses: actions/upload-artifact@v4
        with:
          name: leadgen-db
          path: leadgen/data/leadgen.db
          retention-days: 90
          if-no-files-found: error
