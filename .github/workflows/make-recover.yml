name: Make IG Recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe"
        required: true
        default: "probe"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: IG-only recovery scenario
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          node - <<'NODE'
          const token = process.env.MAKE_API_TOKEN;
          const mode = process.env.MODE || 'probe';
          if (!token) { console.error('NO TOKEN'); process.exit(1); }
          const TEAM_ID = 1916320;
          const PROD_ID = 6674985;
          const base = 'https://eu1.make.com/api/v2';
          const IMAGES = [1,2,3,4].map(i => `https://www.cemform.it/social/carousel/2026-10-28/agg-f6df0f9e-slide-${i}.png`);
          const CAPTION = `Politica in classe, la riflessione di Enrico Galiano sul ruolo del docente

Il dibattito sull'opportunità per gli insegnanti di trattare temi politici all'interno delle aule scolastiche chiama in causa il confine delicato tra la trasmissione di valori civici e il rischio di sconfinare nella propaganda partitica. Sul tema è intervenuto lo scrittore e insegnante Enrico Galiano, offrendo una riflessione sul ruolo educativo del docente e sul significato autentico del termine "politica".

#DocentiItaliani #SupplenzeDocenti #NotizieScuola`;
          async function api(path, opts = {}) {
            const res = await fetch(base + path, {
              ...opts,
              headers: { Authorization: `Token ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
            });
            const text = await res.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            return { status: res.status, json, text };
          }
          const handler = (id) => ({
            id, module: 'builtin:Break', version: 1, parameters: {},
            mapper: { count: '3', retry: true, interval: '1' },
            metadata: {
              designer: { x: 300, y: 150 },
              restore: { expect: { retry: { mode: 'chose' } } },
              expect: [
                { name: 'retry', type: 'boolean', label: 'Automatically complete execution', required: true },
                { name: 'count', type: 'uinteger', label: 'Number of attempts', required: true, validate: { max: 10000, min: 1 } },
                { name: 'interval', type: 'uinteger', label: 'Interval between attempts', required: true, validate: { max: 44640, min: 1 } },
              ],
            },
          });
          function find(list, id) {
            for (const m of list || []) {
              if (m.id === id) return m;
              if (Array.isArray(m.routes)) { for (const rt of m.routes) { const f = find(rt.flow, id); if (f) return f; } }
              if (Array.isArray(m.onerror)) { const f = find(m.onerror, id); if (f) return f; }
            }
            return null;
          }
          (async () => {
            const r = await api(`/scenarios/${PROD_ID}/blueprint`);
            if (r.status !== 200) { console.log('PROD GET HTTP', r.status, r.text.slice(0,300)); process.exit(1); }
            const resp = r.json.response || r.json;
            let bp = resp.blueprint; if (typeof bp === 'string') bp = JSON.parse(bp);
            const prodIg = find(bp.flow, 13);
            if (!prodIg) { console.log('IG module 13 not found'); process.exit(1); }

            const ig = JSON.parse(JSON.stringify(prodIg));
            ig.id = 1;
            delete ig.onerror;
            ig.mapper = { ...(ig.mapper || {}) };
            ig.mapper.files = IMAGES.map(u => ({ image_url: u, media_type: 'IMAGE' }));
            ig.mapper.caption = CAPTION;
            ig.metadata = ig.metadata || {};
            ig.metadata.designer = { x: 0, y: 0 };
            ig.onerror = [handler(2)];

            const recovery = {
              name: 'CEMFORM IG recovery 2026-10-28 (temporary)',
              flow: [ig],
              metadata: { version: 1, scenario: { dlq: true } },
            };
            if (mode === 'probe') {
              const c = await api(`/scenarios?confirmed=true`, {
                method: 'POST',
                body: JSON.stringify({ blueprint: JSON.stringify(recovery), teamId: TEAM_ID, scheduling: JSON.stringify({ type: 'on-demand' }) }),
              });
              console.log('CREATE HTTP', c.status);
              const sc = c.json && c.json.scenario;
              console.log('CREATED', JSON.stringify(sc && { id: sc.id, name: sc.name, isActive: sc.isActive, isinvalid: sc.isinvalid, concept: sc.concept }));
              if (c.status !== 200) { console.log('CREATE BODY', c.text.slice(0, 600)); process.exit(1); }
              if (sc && sc.id) {
                const d = await api(`/scenarios/${sc.id}`, { method: 'DELETE' });
                console.log('DELETE HTTP', d.status);
              }
            }
          })().catch(e => { console.error('ERR', e.stack || e.message); process.exit(1); });
          NODE
