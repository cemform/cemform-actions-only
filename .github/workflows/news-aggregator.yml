name: News Aggregator

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Run avviato da cron-job.org (sleep random anti-pattern)'
        required: false
        default: 'false'
        type: boolean
      tier:
        description: 'Filtro tier: primary (MIM/USR/INPS/sindacati) o aggregator (Orizzonte/Tecnica) o vuoto=tutti'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - primary
          - aggregator

permissions:
  contents: write

concurrency:
  group: news-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep (solo run da cron)
        if: inputs.scheduled == 'true'
        run: |
          # Anti-pattern: ora di pubblicazione variabile invece del minuto
          # randomizzato da cron-job.org. 3 avvii/ora (minuti fissi 5/25/45):
          # basta 0-4 min di variabilità per non pubblicare mai allo stesso minuto.
          SLEEP=$((RANDOM % 240))
          echo "Sleeping $SLEEP seconds"
          sleep $SLEEP

      - uses: actions/checkout@v6
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run news aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_MIU: ${{ secrets.GEMINI_API_KEY_MIU }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          NEWS_TIER: ${{ inputs.tier }}
        run: |
          # La partenza casuale è gestita dallo sleep random qui sopra
          # (solo per i run da cron, input 'scheduled').
          date
          echo "Tier filter: ${{ inputs.tier }}"
          if [ -n "${{ inputs.tier }}" ]; then
            node scripts/news-aggregator.js --tier=${{ inputs.tier }}
          else
            node scripts/news-aggregator.js
          fi

      - name: Commit and push changes
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "notizie: aggiornamento automatico $(date +'%Y-%m-%d') [skip actions]"
          # Merge-safe push: se il remote è avanzato (race), fai union di .published.json
          # invece di scartare con -X theirs. La concorrenza è già serializzata via 'concurrency',
          # ma questo è un paracadute per push falliti.
          if ! git push; then
            echo "Push failed, remote avanzato — eseguo merge union di .published.json"
            git fetch origin main
            # Salva la nostra versione
            cp notizie/.published.json /tmp/ours.json
            git checkout origin/main -- notizie/.published.json || true
            cp notizie/.published.json /tmp/theirs.json
            # Union merge via node (dedup per slug, tieni il più vecchio)
            node -e "
              const fs=require('fs');
              const ours=JSON.parse(fs.readFileSync('/tmp/ours.json','utf8'));
              const theirs=JSON.parse(fs.readFileSync('/tmp/theirs.json','utf8'));
              const seen=new Set(theirs.map(e=>e.slug));
              const merged=[...theirs];
              let added=0;
              for(const e of ours){ if(!seen.has(e.slug)){ merged.push(e); seen.add(e.slug); added++; } }
              // Dedup finale (se duplicati interni)
              const dedup=[]; const s2=new Set();
              for(const e of merged){ if(s2.has(e.slug)) continue; s2.add(e.slug); dedup.push(e); }
              dedup.sort((a,b)=>(a.dateObj||'').localeCompare(b.dateObj||''));
              fs.writeFileSync('notizie/.published.json', JSON.stringify(dedup,null,2)+'\n');
              console.log('Merge union: theirs '+theirs.length+' + ours '+ours.length+' -> '+dedup.length+' (added '+added+')');
            "
            # Rigenera sitemap/feed dopo il merge (senza Gemini, solo pagine)
            node scripts/news-aggregator.js --regen-pages || true
            git add -A
            if git diff --cached --quiet; then
              echo "Niente da committare dopo il merge"
              exit 0
            fi
            git commit -m "notizie: merge union dopo race [skip actions]" || true
            git push
          fi
