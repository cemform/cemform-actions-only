name: News Aggregator

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Run avviato da cron-job.org (sleep random anti-pattern)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep (solo run da cron)
        if: inputs.scheduled == 'true'
        run: |
          # Anti-pattern: ora di pubblicazione variabile invece del minuto
          # randomizzato da cron-job.org. 3 avvii/ora (minuti fissi 5/25/45):
          # basta 0-3 min di variabilità per non pubblicare mai allo stesso minuto.
          SLEEP=$((RANDOM % 180))
          echo "Sleeping $SLEEP seconds"
          sleep $SLEEP

      - uses: actions/checkout@v6
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run news aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          # La partenza casuale è gestita dallo sleep random qui sopra
          # (solo per i run da cron, input 'scheduled').
          date
          node scripts/news-aggregator.js

      - name: Commit and push changes
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "notizie: aggiornamento automatico $(date +'%Y-%m-%d') [skip actions]"
          git pull --rebase -X theirs origin main || { echo "Rebase conflict, aborting"; git rebase --abort; exit 0; }
          git push
