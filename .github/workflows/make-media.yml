name: Make IG Media Probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe, diag, hello or run"
        required: true
        default: "probe"
      body:
        description: "respond body (run mode)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IG media probe
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          BODY: ${{ inputs.body }}
        run: node media.js
