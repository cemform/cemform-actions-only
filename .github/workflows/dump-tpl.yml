name: Dump template blueprint
on:
  workflow_dispatch:
    inputs:
      templateUrl:
        description: "template url"
        required: true
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          TPL: ${{ inputs.templateUrl }}
        run: |
          node - <<'NODE'
          const token = process.env.MAKE_API_TOKEN;
          const base = 'https://eu1.make.com/api/v2';
          const res = await fetch(`${base}/templates/public/${encodeURIComponent(process.env.TPL)}/blueprint`, { headers: { Authorization: `Token ${token}` } });
          const json = await res.json();
          const resp = json.response || json;
          let bp = resp.blueprint || resp;
          if (typeof bp === 'string') bp = JSON.parse(bp);
          console.log(JSON.stringify(bp, null, 1));
          NODE
