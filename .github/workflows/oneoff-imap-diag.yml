name: One-off IMAP thread diagnostic
# TEMPORANEO: verifica dove arrivano le notifiche Web3Forms e se Gmail aggancia
# una bozza con In-Reply-To/References ma oggetto diverso. Non stampa dati
# personali: solo conteggi, date, thread id e booleani. Da eliminare dopo l'uso.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}
      - uses: actions/checkout@v4
        with:
          repository: cemform/cemform-actions-only
          path: worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnostica IMAP
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node worker/diag/imap-thread-diag.mjs
