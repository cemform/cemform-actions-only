name: Make API Ops
on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect"
        required: true
        default: "inspect"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Make scenario blueprint
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          node - <<'NODE'
          const token = process.env.MAKE_API_TOKEN;
          if (!token) { console.error('NO TOKEN'); process.exit(1); }
          const scenarioId = '6674985';
          const base = 'https://eu1.make.com/api/v2';
          async function api(path, opts = {}) {
            const res = await fetch(base + path, {
              ...opts,
              headers: { Authorization: `Token ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
            });
            const text = await res.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            return { status: res.status, json, text };
          }
          (async () => {
            const r = await api(`/scenarios/${scenarioId}/blueprint`);
            if (r.status !== 200) {
              console.log('HTTP', r.status, r.text.slice(0, 800));
              process.exit(1);
            }
            const resp = r.json.response || r.json;
            let bp = resp.blueprint;
            if (typeof bp === 'string') bp = JSON.parse(bp);
            const mods = [];
            function walk(list, path) {
              for (const m of list || []) {
                mods.push({
                  path,
                  id: m.id,
                  module: m.module,
                  version: m.version,
                  label: m.label || m.name || null,
                  paramKeys: Object.keys(m.parameters || {}),
                  mapperKeys: Object.keys(m.mapper || {}),
                  onerror: (m.onerror || []).map(h => ({ id: h.id, module: h.module, mapper: h.mapper })),
                });
                if (Array.isArray(m.routes)) m.routes.forEach((rt, i) => walk(rt.flow, `${path}/routes[${i}]`));
                if (Array.isArray(m.onerror)) walk(m.onerror, `${path}/onerror(${m.id})`);
              }
            }
            walk(bp.flow, 'flow');
            const sd = await api(`/scenarios/${scenarioId}`);
            const sc = (sd.json && sd.json.scenario) || {};
            console.log('SCENARIO', JSON.stringify({
              id: sc.id, name: sc.name, isActive: sc.isActive, isPaused: sc.isPaused,
              isinvalid: sc.isinvalid, hookId: sc.hookId, lastEdit: sc.lastEdit,
              nextExec: sc.nextExec, dlqCount: sc.dlqCount, scheduling: sc.scheduling,
            }));
            let ig = null;
            function findIg(list) {
              for (const m of list || []) {
                if (m.id === 13) ig = m;
                if (Array.isArray(m.routes)) m.routes.forEach(rt => findIg(rt.flow));
                if (Array.isArray(m.onerror)) findIg(m.onerror);
              }
            }
            findIg(bp.flow);
            if (ig) {
              const params = { ...(ig.parameters || {}) };
              if (params.__IMTCONN__) params.__IMTCONN__ = '<redacted>';
              console.log('IG13_PARAMS', JSON.stringify(params));
              console.log('IG13_MAPPER', JSON.stringify(ig.mapper));
            }
            console.log(JSON.stringify({
              scenarioId,
              blueprintVersion: resp.version,
              metadata: bp.metadata,
              moduleCount: mods.length,
              modules: mods,
            }, null, 1));
          })().catch(e => { console.error('ERR', e.message); process.exit(1); });
          NODE
