name: leadgen-daily

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo preparazione email (nessun invio reale)'
        type: boolean
        default: true
      send_only:
        description: 'Solo invio ai lead già qualificati (salta discovery/enrich/verify/score, segna sent_at)'
        type: boolean
        default: false
      sources:
        description: 'Sorgenti da eseguire (csv, vuoto = tutte quelle abilitate)'
        type: string
        default: ''

jobs:
  leadgen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: LeadGen run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_MIU: ${{ secrets.GEMINI_API_KEY_MIU }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_USER: ${{ secrets.SMTP_USER }}
          IMAP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          ARGS=""
          if [ "${{ inputs.send_only }}" = "true" ]; then
            ARGS="$ARGS --send-only"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --only ${{ inputs.sources }}"; fi
          node scripts/leadgen-run.js $ARGS

      - name: IMAP poll (bounce / reply / opt-out)
        if: always()
        env:
          IMAP_USER: ${{ secrets.SMTP_USER }}
          IMAP_PASS: ${{ secrets.SMTP_PASS }}
        run: node scripts/leadgen-run.js --imap || true

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add leadgen/data/leadgen.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "leadgen: aggiornamento automatico DB $(date +'%Y-%m-%d') [skip actions]"
            git pull --rebase -X theirs origin main || { echo "Rebase conflict, aborting"; git rebase --abort; exit 0; }
            git push
          fi
