name: Make IG Recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run or cleanup or probe"
        required: true
        default: "run"
      scenario_id:
        description: "scenario id for cleanup"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run IG-only recovery
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          SCENARIO_ID: ${{ inputs.scenario_id }}
        run: node recover.js
