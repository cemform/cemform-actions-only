name: Offer Timers Renewal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Renew expired timers
        run: node scripts/manage-offer-timers.js

      - name: Commit and push changes
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "timer: rinnovo automatico offerte $(date +'%Y-%m-%d') [skip ci]"
          git pull --rebase -X theirs origin main || { echo "Rebase conflict, aborting"; git rebase --abort; exit 0; }
          git push
