name: Social News Carousel

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Run da cron-job.org (sleep 0-5m anti-pattern)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: push-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Random sleep (solo run da cron)
        if: inputs.scheduled == 'true'
        run: |
          SLEEP=$((RANDOM % 300))
          echo "Sleeping $SLEEP seconds (0-5m)"
          sleep $SLEEP

      - uses: actions/checkout@v6
        with:
          repository: cemform/cemform.it
          ref: main
          token: ${{ secrets.PAT_PRIVATE }}

      - name: Pull latest
        run: git pull origin main

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # NOTA (2026-08-19): step "Install native dependencies for canvas" RIMOSSO.
      # Il generatore usa @napi-rs/canvas (binari prebuilt via npm, nessuna libreria
      # di sistema): npm ci scarica @napi-rs/canvas-linux-x64-gnu dal registry.
      # Lo step apt causava fallimenti ricorrenti per mirror Azure Ubuntu down
      # (3h26m di hang il 16/08, timeout 5m il 19/08 run 32274872602).

      - name: Install dependencies
        run: npm ci

      - name: Select article
        id: select
        run: |
          node scripts/social-content-engine.js --news --batch 1
          TODAY=$(date +%Y-%m-%d)
          CAMP=$(ls -t social/campaigns/$TODAY/*.json 2>/dev/null | head -1)
          if [ -z "$CAMP" ]; then
            echo "No article selected"
            echo "slug=" >> $GITHUB_OUTPUT
          else
            ART_SLUG=$(node -e "console.log(require('$(pwd)/$CAMP').meta.articleSlug)")
            echo "slug=$ART_SLUG" >> $GITHUB_OUTPUT
            echo "campaign=$CAMP" >> $GITHUB_OUTPUT
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_MIU: ${{ secrets.GEMINI_API_KEY_MIU }}
          GEMINI_API_KEY_PRO: ${{ secrets.GEMINI_API_KEY_PRO }}

      - name: Generate carousel
        if: steps.select.outputs.slug != ''
        run: |
          set -e
          node scripts/social-carousel-generator.js --article "${{ steps.select.outputs.slug }}"
          rm -f "${{ steps.select.outputs.campaign }}"
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_MIU: ${{ secrets.GEMINI_API_KEY_MIU }}
          GEMINI_API_KEY_PRO: ${{ secrets.GEMINI_API_KEY_PRO }}

      - name: Commit carousel assets (pre-publish deploy)
        if: steps.select.outputs.slug != ''
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          git diff --cached --quiet && echo "No carousel assets to push" && exit 0
          git commit -m "feat(social): news carousel assets [skip actions]"
          git pull --rebase -X theirs origin main || { echo "Rebase conflict, aborting"; git rebase --abort; exit 0; }
          git push
          echo "Carousel assets pushed — Vercel deploy in corso"

      - name: Wait for Vercel deploy
        if: steps.select.outputs.slug != ''
        run: |
          SLUG="${{ steps.select.outputs.slug }}"
          TODAY=$(date +%Y-%m-%d)
          CAMP_FILE=$(ls -t social/campaigns/$TODAY/carousel-${SLUG}-*.json 2>/dev/null | head -1)
          if [ -z "$CAMP_FILE" ]; then
            echo "No campaign file found for $SLUG, skip wait"
            exit 0
          fi
          URL=$(node -e "const j=require('./' + process.argv[1]); console.log((j.meta&&j.meta.imageUrls&&j.meta.imageUrls[0]) || (j.meta&&j.meta.fallbackImageUrls&&j.meta.fallbackImageUrls[0]) || '')" "$CAMP_FILE")
          if [ -z "$URL" ]; then
            echo "No image URL in campaign, skip wait"
            exit 0
          fi
          echo "Polling Vercel for $URL"
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: facebookexternalhit/1.1" "$URL" || echo "000")
            echo "Attempt $i/18: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Vercel deploy live!"
              exit 0
            fi
            sleep 10
          done
          echo "Warning: Vercel deploy not live after 180s, proceeding anyway (publisher will quarantine if needed)"

      - name: Publish to Facebook
        run: node scripts/social-publisher.js
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}

      - name: Commit publisher state
        run: |
          git config user.name "CEMFORM Bot"
          git config user.email "cemformazione@gmail.com"
          git add -A
          git diff --cached --quiet && echo "No new content" && exit 0
          git commit -m "feat(social): news carousel publish [skip actions]"
          git pull --rebase -X theirs origin main || { echo "Rebase conflict, aborting"; git rebase --abort; exit 0; }
          git push
